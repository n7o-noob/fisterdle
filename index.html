<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Guess the daily Fister cosmetic or map from its clues.">
<title>Fisterdle</title>
<style>
/* Layout: a Fister-style window (Win98 chrome, Tahoma, navy title bar) over the game's sky-and-grass backdrop.
   Single light look on purpose: Fister's own UI has no dark mode. */
:root{
  color-scheme:light;
  --sky1:#7fb6e6; --sky2:#cfe6f6; --grass1:#5fae4b; --grass2:#3f8a35;
  --face:#c0c0c0; --hi:#ffffff; --lite:#dfdfdf; --lo:#808080; --edge:#000000; --ink:#000000; --muted:#404040;
  --title1:#000080; --title2:#1084d0; --field:#ffffff; --pick:#000080; --pick-ink:#ffffff; --bar:#dcdcdc;
  --hit:#2e9a3e; --near:#e08a1e; --miss:#c43a35; --tile-ink:#ffffff;
  --r-common:#7d8794; --r-uncommon:#2e9a3e; --r-rare:#2b6fdc; --r-epic:#8a3fd1; --r-legendary:#f09a1a; --r-fisted:#e2399a; --r-achievement:#e2b81c;
  --ui:Tahoma,"Segoe UI",Verdana,Geneva,sans-serif;
}
[hidden]{display:none!important}
html{background:var(--grass2)}
body{min-height:100%;margin:0;box-sizing:border-box;color:var(--ink);font:13px/1.35 var(--ui);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 52%,var(--grass1) 52%,var(--grass2) 100%) fixed;
  padding-block:24px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* Win98 bevels */
.raised{background:var(--face);border:1px solid;border-color:var(--hi) var(--edge) var(--edge) var(--hi);box-shadow:inset -1px -1px 0 var(--lo),inset 1px 1px 0 var(--lite)}
.sunken{border:1px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:inset 1px 1px 0 var(--edge),inset -1px -1px 0 var(--lite)}
.window{max-width:760px;margin:0 auto;padding:3px;display:flex;flex-direction:column;gap:3px}
.titlebar{display:flex;align-items:center;gap:6px;height:24px;padding:0 3px 0 4px;background:linear-gradient(90deg,var(--title1),var(--title2));color:#fff}
.titlebar h1{margin:0;font:700 13px/1 var(--ui);flex:1;letter-spacing:.01em}
.logo{width:18px;height:16px;flex:none}
.tb-btn{width:18px;height:16px;padding:0;display:grid;place-items:center;font:700 11px/1 var(--ui);color:#000;cursor:default}
.body{display:flex;flex-direction:column;gap:10px;padding:8px 6px 6px}
button,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
.btn{background:var(--face);border:1px solid;border-color:var(--hi) var(--edge) var(--edge) var(--hi);box-shadow:inset -1px -1px 0 var(--lo),inset 1px 1px 0 var(--lite);padding:4px 14px;min-height:26px;font-weight:700}
.btn:active:not(:disabled){border-color:var(--edge) var(--hi) var(--hi) var(--edge);box-shadow:inset 1px 1px 0 var(--lo)}
.btn:focus-visible{outline:1px dotted #000;outline-offset:-5px}
.btn:disabled{color:var(--lo);text-shadow:1px 1px 0 var(--hi);cursor:default}
/* panels like the Loadout's "Wearables" / "Hats" */
.panel{padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel>h2{margin:0;font:700 14px/1.2 var(--ui)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spread{justify-content:space-between}
/* tabs */
.tabs{display:flex;gap:0;align-items:flex-end;padding-left:4px;margin-bottom:-11px;position:relative;z-index:1}
.tab{background:var(--face);border:1px solid;border-color:var(--hi) var(--edge) transparent var(--hi);box-shadow:inset -1px 0 0 var(--lo);padding:4px 14px 5px;font-weight:700;margin-right:-1px}
.tab[aria-selected="true"]{padding:6px 16px 7px;margin-bottom:-1px;position:relative;z-index:2;border-bottom-color:var(--face)}
.tab:focus-visible{outline:1px dotted #000;outline-offset:-4px}
.status{color:var(--muted)}
.status b{color:var(--ink)}
/* guess bar like the Hats search bar */
.searchbar{padding:6px 8px;background:var(--face)}
.guessbox{position:relative;display:flex;gap:6px;align-items:center;flex:1;min-width:0}
.guessbox label{font-weight:700}
.guessbox input{flex:1;min-width:0;height:26px;padding:2px 6px;background:var(--field);border:1px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:inset 1px 1px 0 var(--edge)}
.guessbox input:focus{outline:none}
.guessbox input:disabled{background:var(--face)}
.list{position:absolute;left:0;right:0;top:100%;margin:2px 0 0;padding:2px;list-style:none;max-height:min(320px,55vh);overflow-y:auto;z-index:6;background:var(--field);border:1px solid #000}
.list li{display:flex;justify-content:space-between;gap:12px;padding:3px 6px;cursor:default}
.list li small{color:var(--muted);white-space:nowrap}
.list li[aria-selected="true"]{background:var(--pick);color:var(--pick-ink)}
.list li[aria-selected="true"] small{color:var(--pick-ink)}
.clues{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.clue{padding:3px 8px;background:var(--field)}
/* clue table */
.tablewrap{background:var(--field);padding:8px;overflow-x:auto}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) repeat(3,minmax(0,1fr));gap:6px;min-width:300px}
.head{font:700 12px/1 var(--ui);text-align:center;padding:5px 2px;background:var(--face);border:1px solid;border-color:var(--hi) var(--edge) var(--edge) var(--hi);box-shadow:inset -1px -1px 0 var(--lo)}
.cell{min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;text-align:center;font:700 12px/1.2 var(--ui);overflow-wrap:anywhere;color:var(--tile-ink);text-shadow:1px 1px 0 #0006;
  border:1px solid;border-color:#ffffff99 #000 #000 #ffffff99;box-shadow:inset -1px -1px 0 #0004}
.cell.hit{background:var(--hit)}.cell.near{background:var(--near)}.cell.miss{background:var(--miss)}
/* guessed item: styled like a Loadout card */
.card{padding:0;justify-content:flex-start;gap:0;color:var(--ink);text-shadow:none;background:#bdbdbd;border-color:var(--hi) var(--edge) var(--edge) var(--hi);box-shadow:inset -1px -1px 0 var(--lo)}
.card .bar{align-self:stretch;margin:4px 4px 0;padding:2px;background:var(--bar);font-weight:700;font-size:11px;color:var(--muted)}
.card .nm{padding:6px 6px 8px;flex:1;display:flex;align-items:center;justify-content:center}
.badge{display:inline-block;padding:1px 6px;color:#fff;font:700 11px/1.35 var(--ui);text-shadow:1px 1px 0 #000a;border:1px solid #000;box-shadow:inset 1px 1px 0 #ffffff55}
.arrow{font-size:18px;line-height:1}
.cell.flip{animation:flip .38s ease both}
@keyframes flip{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.cell.flip{animation:none}}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:16px 8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:5px;border:1px solid #000}
/* result */
.result h3{margin:0;font:700 18px/1.2 var(--ui);text-wrap:balance}
.result p{margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.share-text{width:100%;box-sizing:border-box;font:12px/1.3 "Lucida Console",Consolas,monospace;resize:none;padding:4px;background:var(--field)}
.statusbar{display:flex;gap:3px}
.statusbar>div{padding:2px 8px;flex:0 1 auto;color:var(--ink);font-variant-numeric:tabular-nums}
.statusbar>div:last-child{flex:1;text-align:right;color:var(--muted)}
.card .thumb{width:56px;height:56px;object-fit:contain;margin:4px auto 0;image-rendering:auto}
.card .nm{padding-top:4px}
.opt-name{display:flex;align-items:center;gap:6px;min-width:0}
.icon{width:22px;height:22px;object-fit:contain;flex:none}
.reveal-row{display:flex;gap:12px;align-items:center}
.reveal{width:88px;height:88px;object-fit:contain;flex:none;background:#bdbdbd;border:1px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.pic-hint{display:flex;align-items:center;gap:8px}
.blurred{width:64px;height:64px;object-fit:contain;filter:blur(5px) saturate(.6);transform:scale(.92)}
.seg{display:flex}
.seg .btn{min-height:24px;padding:3px 12px}
.seg .btn[aria-pressed="true"]{border-color:var(--edge) var(--hi) var(--hi) var(--edge);box-shadow:inset 1px 1px 0 var(--lo);background:#d4d4d4}
.modes{display:flex;flex-direction:column;gap:2px}
.card.map .thumb{width:96px;height:54px;object-fit:cover}
.reveal.map{width:140px;height:79px;object-fit:cover}
.blurred.map{width:112px;height:63px;object-fit:cover}
/* dialog-style toast, like the game's message boxes */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;min-width:180px;padding:3px}
.toast .titlebar{height:20px}
.toast p{margin:0;padding:10px 14px;font-weight:700;text-align:center}
@media (max-width:520px){.tablewrap{padding:5px}.grid{gap:4px}.cell{min-height:62px;font-size:11px;padding:4px 2px}.head{font-size:11px}.btn{padding:4px 10px}.badge{font-size:10px;padding:1px 4px}.guessbox label{display:none}.statusbar{flex-wrap:wrap}.statusbar>div{font-size:11px;padding:2px 5px}.statusbar>div:last-child{display:none}}
</style>
</head>

const TYPES={hat:'Hat',face:'Face',accessory:'Accessory',shirt:'Shirt',pants:'Pants',shoes:'Shoes',gloves:'Fists',cape:'Cape',badge:'Badge',banner:'Banner',patch:'Patch',emote:'Emote',air_trick:'Air trick',trail:'Trail',death_effect:'Death effect',punch_effect:'Punch effect',kill_sound:'Kill sound',punch_sound:'Punch sound',air_kick_sound:'Air kick sound',grab_sound:'Grab sound',parry_sound:'Parry sound'};

// Everyone gets the same daily puzzle: days roll over at midnight Pacific time, wherever you are.

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,w,ws)=>n+' '+(n===1?w:(ws||w+'s'));

function zoneParts(){const p={};for(const x of new Intl.DateTimeFormat('en-US',{timeZone:ZONE,year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'}).formatToParts(new Date()))p[x.type]=Number(x.value);return p;}
function dayNumber(){const p=zoneParts();return Math.floor((Date.UTC(p.year,p.month-1,p.day)-EPOCH)/864e5)+1;}
function untilNext(){const p=zoneParts(),left=86400-(p.hour*3600+p.minute*60+p.second);const h=Math.floor(left/3600),m=Math.floor(left%3600/60);return h?h+'h '+m+'m':m+'m';}
function pick(seed,n){let t=(seed*2654435761)>>>0;t+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)%n;}
const creators=s=>new Set(String(s||'').toLowerCase().split(/\s*(?:,|&|\band\b)\s*/).map(x=>x.trim()).filter(Boolean));
function overlap(a,b){let n=0;for(const x of a)if(b.has(x))n++;return n;}

// ---- categories: what you guess and how each guess is compared ----
const CATS={
 cosmetics:{noun:'cosmetic',nouns:'cosmetics',seed:11,
  items:DATA.map(([name,type,rarity,creator,answer,pv],id)=>({id,name,type,rarity,creator,answer:!!answer,key:name.toLowerCase(),img:pv?(pv[0]==='/'?ASSETS+pv:ASSETS+'/assets/previews/cosmetics/'+pv):''})),
  cols:['Cosmetic','Rarity','Creator','Type'],
  empty:'Guess any cosmetic to see how its rarity, creator and type compare.',
  legend:'<span><i style="background:var(--hit)"></i>Match</span><span><i style="background:var(--near)"></i>Same area (head, body, sound, effect, move)</span><span><i style="background:var(--miss)"></i>No match · ↑ answer is rarer, ↓ more common</span>',
  compare(g,a){return [
    g.rarity===a.rarity?{s:'hit',v:[badge(g.rarity)]}:{s:'miss',v:[badge(g.rarity),arrow(TIER[a.rarity]>TIER[g.rarity]?'↑':'↓')]},
    {s:g.creator===a.creator?'hit':'miss',v:g.creator},
    {s:g.type===a.type?'hit':GROUP[g.type]===GROUP[a.type]?'near':'miss',v:TYPES[g.type]||g.type}];},
  sub(i){return (TYPES[i.type]||i.type)+' · '+i.creator;},
  meta(a){const t=document.createElement('b');t.textContent=TYPES[a.type]||a.type;const c=document.createElement('span');c.textContent='by '+a.creator;return [badge(a.rarity),t,c];}},
 maps:{noun:'map',nouns:'maps',seed:29,
  items:MAPS.map(([name,creator,origin,modes,img],id)=>({id,name,creator,origin,modes,cset:creators(creator),answer:true,key:name.toLowerCase(),img:img?SITE+img:'',wide:true})),
  cols:['Map','Creator','Origin','Game modes'],
  empty:'Guess any map to see how its creator, origin and game modes compare.',
  legend:'<span><i style="background:var(--hit)"></i>Match</span><span><i style="background:var(--near)"></i>Partly (a shared creator, or some of the same modes)</span><span><i style="background:var(--miss)"></i>No match</span><span>FFA free for all · TDM team deathmatch · KOTH king of the hill · CTF capture the fist</span>',
  compare(g,a){const sameC=g.creator.toLowerCase()===a.creator.toLowerCase(),shareC=overlap(g.cset,a.cset)>0;
   const gm=new Set(g.modes),am=new Set(a.modes),both=overlap(gm,am),sameM=both===gm.size&&both===am.size;
   const modes=document.createElement('span');modes.className='modes';for(const m of g.modes){const d=document.createElement('span');d.textContent=MODES[m]||m;modes.append(d);}
   return [{s:sameC?'hit':shareC?'near':'miss',v:g.creator},
    {s:g.origin===a.origin?'hit':'miss',v:g.origin==='official'?'Official':'Community'},
    {s:sameM?'hit':both?'near':'miss',v:[modes]}];},
  sub(i){return i.creator;},
  meta(a){const o=document.createElement('b');o.textContent=a.origin==='official'?'Official map':'Community map';const c=document.createElement('span');c.textContent='by '+a.creator;const m=document.createElement('span');m.textContent=a.modes.map(x=>MODES[x]).join(', ');return [o,c,m];}}};
for(const c of Object.values(CATS)){c.pool=c.items.filter(i=>i.answer);c.dupes=new Set();const seen=new Set();for(const i of c.items){if(seen.has(i.key))c.dupes.add(i.key);seen.add(i.key);}}

// Pictures come straight from Fister's servers. Any that fail (or are blocked) are simply left out.
const badImg=new Set(),goodImg=new Set();
function thumb(item,cls){if(!item.img||badImg.has(item.img))return null;const im=document.createElement('img');im.className=cls+(item.wide?' map':'');im.alt='';im.decoding='async';im.loading='lazy';im.referrerPolicy='no-referrer';
  im.onload=()=>goodImg.add(item.img);im.onerror=()=>{badImg.add(item.img);im.remove();};im.src=item.img;return im;}
function badge(r){const b=document.createElement('span');b.className='badge';b.style.background='var(--r-'+(RARE[r]?r:'common')+')';b.textContent=RARE[r]||r||'?';return b;}
function arrow(a){const s=document.createElement('span');s.className='arrow';s.textContent=a;return s;}

let catKey='cosmetics',mode='daily',game=null,answerPic=false;
const cat=()=>CATS[catKey];
const answer=()=>cat().items[game.answer];
const slot=()=>catKey+':'+mode;
function newGame(c,m){catKey=c||catKey;mode=m||mode;const C=cat();
  if(mode==='daily'){const day=dayNumber(),a=C.pool[pick(day+C.seed,C.pool.length)],saved=store.get(slot(),null);
    game=saved&&saved.day===day&&saved.answer===a.id?saved:{day,answer:a.id,guesses:[],hints:0,done:false};}
  else{const saved=store.get(slot(),null);game=saved&&!saved.done&&C.items[saved.answer]?saved:{answer:C.pool[Math.floor(Math.random()*C.pool.length)].id,guesses:[],hints:0,done:false};}
  store.set(slot(),game);try{localStorage.setItem('fisterdle3:last',JSON.stringify({c:catKey,m:mode}));}catch{}
  answerPic=false;const a0=answer();if(a0.img){const pre=new Image();pre.referrerPolicy='no-referrer';const want=slot()+game.answer;pre.onload=()=>{if(slot()+game.answer===want){answerPic=true;goodImg.add(a0.img);renderClues();}};pre.onerror=()=>badImg.add(a0.img);pre.src=a0.img;}
  $('guess').value='';closeList();render(false);if(!game.done)$('guess').focus({preventScroll:true});}

function cell(cls,content,delay){const c=document.createElement('div');c.className='cell '+cls;if(delay!=null){c.classList.add('flip');c.style.animationDelay=delay+'ms';}
  if(typeof content==='string')c.textContent=content;else c.append(...content);return c;}
function render(flipNewest){const C=cat();
  for(const k of Object.keys(CATS))$('cat-'+k).setAttribute('aria-selected',k===catKey);
  $('mode-daily').setAttribute('aria-pressed',mode==='daily');$('mode-endless').setAttribute('aria-pressed',mode==='endless');
  $('guess-title').textContent='Guess the '+C.noun;
  $('status').innerHTML=(mode==='daily'?'Daily <b>#'+game.day+'</b> · new in '+untilNext():'Endless')+' · <b>'+game.guesses.length+'</b> '+(game.guesses.length===1?'guess':'guesses');
  $('legend').innerHTML=C.legend;
  const grid=$('grid');grid.replaceChildren();
  C.cols.forEach(h=>{const d=document.createElement('div');d.className='head';d.setAttribute('role','columnheader');d.textContent=h;grid.append(d);});
  if(!game.guesses.length){const e=document.createElement('div');e.className='empty';e.textContent=C.empty;grid.append(e);}
  const a=answer();
  [...game.guesses].reverse().forEach((gid,ri)=>{const g=C.items[gid],cmp=C.compare(g,a),anim=flipNewest&&ri===0;
    const bar=document.createElement('div');bar.className='bar';bar.textContent=g.id===game.answer?'Found':'Guess '+(game.guesses.length-ri);
    const nm=document.createElement('div');nm.className='nm';nm.textContent=g.name;
    const t=thumb(g,'thumb');grid.append(cell('card',t?[bar,t,nm]:[bar,nm],anim?0:null));
    cmp.forEach((x,k)=>grid.append(cell(x.s,typeof x.v==='string'?x.v:x.v,anim?120*(k+1):null)));});
  renderClues();renderResult();renderStats();
  $('guess').disabled=$('go').disabled=game.done;$('guess').placeholder=game.done?(game.skipped?'Skipped':'Solved'):'Type a '+C.noun+' name…';
  $('skip').hidden=mode!=='endless'||game.done;}

const hintMax=()=>3+(answerPic?1:0);
function hintText(n,a){const words=a.name.trim().split(/\s+/),letters=a.name.replace(/[^\p{L}\p{N}]/gu,'').length;
  if(n===1)return 'Starts with <b>'+esc(a.name.trim()[0].toUpperCase())+'</b>';
  if(n===2)return '<b>'+letters+'</b> letters'+(words.length>1?', <b>'+words.length+'</b> words':'');
  return '<b>'+esc(words.map(w=>[...w].map((c,k)=>k===0||!/[\p{L}\p{N}]/u.test(c)?c:'_').join('')).join('  '))+'</b>';}
function renderClues(){const box=$('clues'),btn=$('hint'),used=game.hints||0,a=answer();box.replaceChildren();
  for(let n=1;n<=Math.min(used,3);n++){const d=document.createElement('div');d.className='clue sunken';d.innerHTML=hintText(n,a);box.append(d);}
  if(used>=4&&answerPic){const d=document.createElement('div');d.className='clue sunken pic-hint';const im=thumb(a,'blurred');if(im)d.append(im);const l=document.createElement('span');l.textContent='Blurred picture';d.append(l);box.append(d);}
  btn.hidden=game.done;btn.disabled=used>=hintMax();btn.textContent=used>=hintMax()?'No hints left':'Hint ('+(hintMax()-used)+' left)';}
function useHint(){if(game.done||(game.hints||0)>=hintMax())return;game.hints=(game.hints||0)+1;store.set(slot(),game);renderClues();}
function skip(){if(mode!=='endless'||game.done)return;game.done=true;game.skipped=true;store.set(slot(),game);closeList();render(false);}

// ---- autocomplete ----
let matches=[],active=-1;
function search(q){q=q.trim().toLowerCase();if(!q)return [];const guessed=new Set(game.guesses),starts=[],inside=[];
  for(const i of cat().items){if(guessed.has(i.id))continue;const p=i.key.indexOf(q);if(p===0)starts.push(i);else if(p>0)inside.push(i);if(starts.length>=40)break;}
  return starts.concat(inside).slice(0,40);}
function openList(){const C=cat(),list=$('list');list.replaceChildren();matches=search($('guess').value);active=matches.length?0:-1;
  matches.forEach((i,ix)=>{const li=document.createElement('li');li.id='opt-'+ix;li.setAttribute('role','option');li.setAttribute('aria-selected',ix===active);
    const t=thumb(i,'icon');const n=document.createElement('span');n.className='opt-name';if(t)n.append(t);n.append(document.createTextNode(i.name));li.append(n);
    if(C.dupes.has(i.key)){const s=document.createElement('small');s.textContent=C.sub(i);li.append(s);}
    li.onpointerdown=e=>{e.preventDefault();choose(i);};list.append(li);});
  list.hidden=!matches.length;$('guess').setAttribute('aria-expanded',!list.hidden);$('guess').setAttribute('aria-activedescendant',active>=0?'opt-'+active:'');}
function closeList(){$('list').hidden=true;$('guess').setAttribute('aria-expanded','false');matches=[];active=-1;}
function moveActive(d){if(!matches.length)return;active=(active+d+matches.length)%matches.length;[...$('list').children].forEach((li,ix)=>li.setAttribute('aria-selected',ix===active));
  $('list').children[active].scrollIntoView({block:'nearest'});$('guess').setAttribute('aria-activedescendant','opt-'+active);}
function choose(i){if(game.done||game.guesses.includes(i.id))return;game.guesses.push(i.id);$('guess').value='';closeList();
  if(i.id===game.answer){game.done=true;record();}store.set(slot(),game);render(true);
  if(game.done)setTimeout(()=>toast(game.guesses.length===1?'First try!':'You got it'),500);else $('guess').focus({preventScroll:true});}
$('guess').addEventListener('input',openList);
$('guess').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();if($('list').hidden)openList();else moveActive(1);}else if(e.key==='ArrowUp'){e.preventDefault();moveActive(-1);}else if(e.key==='Escape')closeList();});
$('guess').addEventListener('blur',()=>setTimeout(closeList,120));
$('form').addEventListener('submit',e=>{e.preventDefault();if(active>=0&&matches[active])return choose(matches[active]);
  const q=$('guess').value.trim().toLowerCase();if(!q)return;const exact=cat().items.filter(i=>i.key===q&&!game.guesses.includes(i.id));
  if(exact.length===1)choose(exact[0]);else{toast(exact.length?'Pick one from the list':'No '+cat().noun+' with that name');openList();}});

function record(){if(mode!=='daily')return;const k='stats:'+catKey,s=store.get(k,{played:0,total:0,streak:0,last:null});if(s.last===game.day)return;
  s.played++;s.total+=game.guesses.length;s.streak=s.last===game.day-1?s.streak+1:1;s.last=game.day;store.set(k,s);}
function renderStats(){const C=cat(),s=store.get('stats:'+catKey,{played:0,total:0,streak:0});
  $('stats').innerHTML='<div class="sunken">Daily '+C.nouns+' solved: '+s.played+'</div><div class="sunken">Avg guesses: '+(s.played?(s.total/s.played).toFixed(1):'–')+'</div><div class="sunken">Streak: '+s.streak+'</div><div class="sunken">'+C.items.length.toLocaleString()+' '+C.nouns+'</div>';}
function shareText(){const C=cat(),a=answer(),em={hit:'🟩',near:'🟧',miss:'🟥'};
  const rows=game.guesses.map(gid=>C.compare(C.items[gid],a).map(x=>em[x.s]).join(''));
  const hn=game.hints||0;return 'Fisterdle '+(catKey==='maps'?'Maps ':'')+(mode==='daily'?'#'+game.day:'Endless')+' · '+plural(game.guesses.length,'guess','guesses')+' · '+(hn?plural(hn,'hint'):'no hints')+'\n'+(rows.length>8?rows.slice(0,7).join('\n')+'\n…\n'+rows[rows.length-1]:rows.join('\n'));}
function renderResult(){const r=$('result');if(!game.done){r.hidden=true;return;}r.hidden=false;r.replaceChildren();const C=cat(),a=answer();
  const p=document.createElement('p');p.className='status';
  p.textContent=game.skipped?'Skipped. The answer was':'Solved in '+plural(game.guesses.length,'guess','guesses')+((game.hints||0)?' with '+plural(game.hints,'hint'):' with no hints');
  const h=document.createElement('h3');h.textContent=a.name;
  const meta=document.createElement('div');meta.className='meta';meta.append(...C.meta(a));
  const btns=document.createElement('div');btns.className='row';
  const next=document.createElement('button');next.className='btn';
  if(mode==='endless'){next.textContent='Next '+C.noun;next.onclick=()=>{store.set(slot(),null);newGame();};}else{next.textContent='Play endless';next.onclick=()=>newGame(null,'endless');}
  const parts=[];
  if(!game.skipped){const ta=document.createElement('textarea');ta.className='share-text sunken';ta.id='share-text';ta.readOnly=true;ta.rows=Math.min(10,game.guesses.length+1);ta.value=shareText();ta.setAttribute('aria-label','Result to share');
    const copy=document.createElement('button');copy.className='btn';copy.textContent='Copy result';
    copy.onclick=()=>{try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copied'),()=>{ta.select();toast('Press Ctrl+C to copy');});}catch{ta.select();toast('Press Ctrl+C to copy');}};
    btns.append(copy);parts.push(ta);}
  btns.append(next);
  const pic=thumb(a,'reveal');const head=document.createElement('div');head.className='reveal-row';const txt=document.createElement('div');txt.append(p,h,meta);if(pic)head.append(pic);head.append(txt);r.append(head,...parts,btns);}
let tt=0;function toast(t){const el=$('toast');$('toast-text').textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,1600);}

$('hint').onclick=useHint;$('skip').onclick=skip;
$('cat-cosmetics').onclick=()=>newGame('cosmetics');$('cat-maps').onclick=()=>newGame('maps');
$('mode-daily').onclick=()=>newGame(null,'daily');$('mode-endless').onclick=()=>newGame(null,'endless');
// roll over to the next daily if the page is left open past midnight Pacific
setInterval(()=>{if(mode==='daily'&&game&&game.day!==dayNumber())newGame();else if(mode==='daily'&&game)$('status').innerHTML=$('status').innerHTML.replace(/new in [^·<]+/,'new in '+untilNext()+' ');},60000);
{let last={};try{last=JSON.parse(localStorage.getItem('fisterdle3:last')||'{}');}catch{}newGame(CATS[last.c]?last.c:'cosmetics',last.m==='endless'?'endless':'daily');}
</script>
